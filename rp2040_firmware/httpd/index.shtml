<!DOCTYPE html>
<html>
<head>
    <title>RP2040 Gamepad Config</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f0f0; margin: 2em; }
        .container { background-color: white; padding: 2em; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h1 { color: #333; }
        .form-group { margin-bottom: 1.5em; }
        label { display: block; margin-bottom: 0.5em; font-weight: bold; }
        input[type="number"], select { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="checkbox"] { margin-right: 0.5em; }
        .btn { background-color: #007bff; color: white; padding: 0.7em 1.2em; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .btn:hover { background-color: #0056b3; }
        .notice { font-size: 0.9em; color: #666; margin-top: 1em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RP2040 Gamepad Configuration</h1>
        <form action="/settings.cgi" method="post">
            <div class="form-group">
                <label for="output_mode">Output Mode</label>
                <select id="output_mode" name="output_mode">
                    <option value="0" <!--#om_0-->>XInput</option>
                    <option value="1" <!--#om_1-->>Nintendo Switch</option>
                    <option value="2" <!--#om_2--> disabled>DS4 (Not Implemented)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Joystick Inversion</label>
                <input type="checkbox" name="invert_lx" <!--#inv_lx-->> Invert Left Stick X-Axis<br>
                <input type="checkbox" name="invert_ly" <!--#inv_ly-->> Invert Left Stick Y-Axis<br>
                <input type="checkbox" name="invert_rx" <!--#inv_rx-->> Invert Right Stick X-Axis<br>
                <input type="checkbox" name="invert_ry" <!--#inv_ry-->> Invert Right Stick Y-Axis
            </div>
            <div class="form-group">
                <label for="deadzone_l">Left Stick Deadzone (%)</label>
                <input type="number" id="deadzone_l" name="deadzone_l" min="0" max="100" value="<!--#dz_l-->">
            </div>
             <div class="form-group">
                <label for="deadzone_r">Right Stick Deadzone (%)</label>
                <input type="number" id="deadzone_r" name="deadzone_r" min="0" max="100" value="<!--#dz_r-->">
            </div>

            <button type="submit" class="btn">Save Settings</button>
            <p class="notice">Settings will be saved to the device and applied immediately. Device will reboot after saving.</p>
        </form>
    </div>
</body>
</html>
